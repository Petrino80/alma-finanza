<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Montserrat:wght@900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 300px;
    height: 300px;
    overflow: hidden;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
}
.logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
}
.logo-row {
    display: flex;
    align-items: center;
    gap: 4px;
}
.a-letter {
    font-family: 'Lobster', cursive;
    font-size: 120px;
    color: #14b8a6;
    line-height: 1;
}
.lma-text {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: 52px;
    color: #111827;
    letter-spacing: -1px;
    line-height: 1;
}
</style>
</head>
<body>
<div class="logo">
    <div class="logo-row">
        <span class="a-letter">A</span>
        <span class="lma-text">LMA</span>
    </div>
    <div class="lma-text" style="font-size:38px; letter-spacing:4px; color:#14b8a6;">FINANZA</div>
</div>
</body>
</html>
